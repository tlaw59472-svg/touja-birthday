[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  included_files = ["index.html"]

[[redirects]]
  from = "/.netlify/functions/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/protected"
  status = 200
  force = true
